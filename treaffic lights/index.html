        //promise wrapper

        let red = document.getElementById("red");
        let yellow = document.getElementById("yellow");
        let green = document.getElementById("green");

        // Helper to reset all colors
        function clearLights() {
            red.style.backgroundColor = "";
            yellow.style.backgroundColor = "";
            green.style.backgroundColor = "";
        }

        // The Promise Wrapper
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // The Modern Async/Await Sequence
        async function runTrafficLight() {
            while (true) {
                clearLights();
                red.style.backgroundColor = "red";
                await delay(3000); // Pauses here for 3s

                clearLights();
                yellow.style.backgroundColor = "yellow";
                await delay(2000); // Pauses here for 1s

                clearLights();
                green.style.backgroundColor = "green";
                await delay(4000); // Pauses here for 2s
            }
        }

        // Start the infinite loop
        runTrafficLight();
