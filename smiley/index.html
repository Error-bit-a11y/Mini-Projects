<!DOCTYPE html>
<html>
<head>
    <title>Change SVG</title>
</head>

<body>

    <div class="container">

        <svg viewBox="0 0 100 100" width="100" height="100">

            <circle cx="50" cy="50" r="45"
                    fill="#FFD700"
                    stroke="#333333"
                    stroke-width="3" />

            <circle cx="32" cy="40" r="5" fill="#333333" />
            <circle cx="68" cy="40" r="5" fill="#333333" />

            <path id="mouth"
                  d="M 30 60 Q 50 80 70 60"
                  fill="transparent"
                  stroke="#333333"
                  stroke-width="4"
                  stroke-linecap="round" />

        </svg>

        <button id="change">Change</button>

    </div>

    <script>
        let mouth = document.querySelector("#mouth");
        let btn = document.querySelector("#change");

        let smile = true;

        btn.addEventListener("click", function () {

            if (smile) {
                mouth.setAttribute("d", "M 30 70 Q 50 50 70 70");
                smile = false;
            } 
            else {
                mouth.setAttribute("d", "M 30 60 Q 50 80 70 60");
                smile = true;
            }

        });
    </script>

</body>
</html>
