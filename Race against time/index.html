<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        async function getUser() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("err")

                }, 1000);

            })
        }

        async function getComments() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("ypp")

                }, 2000);

            })


        }
        async function Posts() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("nuu")
                }, 3000);

            })

        }

        async function fetchDashboard() {
            console.log("Fetching all data at once...");

            // 1. We AWAIT the Promise.all
            // 2. We pass an ARRAY [ ] containing the three function calls
            let results = await Promise.all([
                getUser(),
                getComments(),
                Posts()
            ]);

            // 3. results is now an array of your resolved strings: ["err", "ypp", "nuu"]
            console.log("All done!", results);
        }
        fetchDashboard();
    </script>

</body>

</html>
